name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The Pi 5 is ARM64; Raspberry Pi OS Bookworm ships Python 3.11 and Trixie 3.13 (#18).
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.11", "3.13"]
    # uv and Python come from the runner image and PyPI, not GitHub release downloads,
    # which time out (504) often enough to fail whole runs.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv sync --locked
      # Voice tests need the mic/model stack from voice/requirements.txt, so they stay local.
      - run: uv run python -m unittest -v $(ls tests/test_*.py | grep -v '/test_voice_')

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh
